version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: wallet-postgres
    restart: always
    environment:
      POSTGRES_DB: wallets
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: wallet-app
    env_file:
      - config.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
